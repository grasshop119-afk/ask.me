<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #000000);
            --tg-accent: var(--tg-theme-button-color, #007AFF);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --nav-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 45px 25px 10px;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: -1.5px;
            text-transform: uppercase;
        }

        .nav-wrapper {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .nav-island {
            position: relative;
            width: 220px;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Тот самый блоб */
        .blob {
            position: absolute;
            width: 44px;
            height: 44px;
            background: var(--tg-accent);
            border-radius: 50%;
            z-index: 0;
            /* Плавное перемещение */
            transition: left 0.5s cubic-bezier(0.19, 1, 0.22, 1), 
                        border-radius 0.4s ease, 
                        transform 0.4s ease;
        }

        /* Деформация вправо */
        .stretch-right {
            border-radius: 40% 65% 65% 40% / 50% 50% 50% 50%;
            transform: scaleX(1.2);
        }

        /* Деформация влево */
        .stretch-left {
            border-radius: 65% 40% 40% 65% / 50% 50% 50% 50%;
            transform: scaleX(1.2);
        }

        .nav-item {
            position: relative;
            width: 60px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item img {
            width: 24px;
            height: 24px;
            filter: invert(1);
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        .nav-item.active img {
            opacity: 1;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #333;
            background-size: cover;
            background-position: center;
            opacity: 0.4;
            transition: opacity 0.3s;
        }

        .active .avatar {
            opacity: 1;
        }

        .content-area {
            flex: 1;
            margin: 10px 20px 100px;
            background: linear-gradient(180deg, #111, #000);
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <div class="header" id="title">FOR YOU</div>

    <div class="content-area"></div>

    <div class="nav-wrapper">
        <div class="nav-island">
            <div class="blob" id="blob"></div>
            
            <div class="nav-item active" id="tab-0" onclick="move(0)">
                <img src="https://cdn-icons-png.flaticon.com/512/6997/6997164.png" alt="home">
            </div>
            
            <div class="nav-item" id="tab-1" onclick="move(1)">
                <img src="https://cdn-icons-png.flaticon.com/512/8025/8025278.png" alt="search">
            </div>
            
            <div class="nav-item" id="tab-2" onclick="move(2)">
                <div class="avatar" id="pfp"></div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const blob = document.getElementById('blob');
        const items = document.querySelectorAll('.nav-item');
        let currentIndex = 0;

        function move(index) {
            const targetItem = document.getElementById(`tab-${index}`);
            
            // Убираем старые классы
            items.forEach(item => item.classList.remove('active'));
            blob.classList.remove('stretch-right', 'stretch-left');

            // Определяем направление деформации
            if (index > currentIndex) {
                blob.classList.add('stretch-right');
            } else if (index < currentIndex) {
                blob.classList.add('stretch-left');
            }

            // Перемещаем блоб точно в центр иконки
            // Вычисляем позицию: offsetLeft иконки + (ширина иконки/2) - (ширина блоба/2)
            const targetX = targetItem.offsetLeft + (targetItem.offsetWidth / 2) - (blob.offsetWidth / 2);
            blob.style.left = `${targetX}px`;
            
            targetItem.classList.add('active');
            currentIndex = index;

            // Возвращаем форму круга плавно к концу анимации
            setTimeout(() => {
                blob.classList.remove('stretch-right', 'stretch-left');
            }, 350);

            tg.HapticFeedback.impactOccurred('light');
        }

        // Локализация
        const lang = tg.initDataUnsafe.user?.language_code || 'en';
        const t = { ru: "ДЛЯ ТЕБЯ", zh: "为你推荐", en: "FOR YOU" };
        document.getElementById('title').innerText = t[lang] || t.en;

        if (tg.initDataUnsafe.user?.photo_url) {
            document.getElementById('pfp').style.backgroundImage = `url(${tg.initDataUnsafe.user.photo_url})`;
        }

        // Инициализация позиции
        window.onload = () => move(0);
    </script>
</body>
</html>
