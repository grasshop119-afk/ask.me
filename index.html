<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #000000);
            --tg-accent: var(--tg-theme-button-color, #007AFF);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --nav-bg: rgba(255, 255, 255, 0.1);
            /* Учет безопасных зон для полноэкранного режима */
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        body {
            margin: 0;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: var(--safe-top);
        }

        .header {
            padding: 20px 25px 10px;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: -1.5px;
            text-transform: uppercase;
            /* Учитываем заголовок в полноэкранном режиме */
            margin-top: 10px;
        }

        .content-area {
            flex: 1;
            margin: 10px 15px calc(100px + var(--safe-bottom));
            background: linear-gradient(180deg, #111, #000);
            border-radius: 35px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }

        .nav-wrapper {
            position: fixed;
            bottom: calc(30px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .nav-island {
            position: relative;
            width: 240px;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .blob {
            position: absolute;
            width: 46px;
            height: 46px;
            background: var(--tg-accent);
            border-radius: 50%;
            z-index: 0;
            /* Центрируем вертикально внутри острова */
            top: 50%;
            margin-top: -23px; 
            left: 10px;
            transition: left 0.5s cubic-bezier(0.19, 1, 0.22, 1), 
                        border-radius 0.35s ease, 
                        transform 0.35s ease;
        }

        /* Деформация при движении */
        .stretch-right {
            border-radius: 40% 70% 70% 40% / 50% 50% 50% 50%;
            transform: scaleX(1.2) translateY(0);
        }

        .stretch-left {
            border-radius: 70% 40% 40% 70% / 50% 50% 50% 50%;
            transform: scaleX(1.2) translateY(0);
        }

        .nav-item {
            position: relative;
            width: 50px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item img {
            width: 26px;
            height: 26px;
            filter: invert(1);
            opacity: 0.3;
            transition: all 0.3s ease;
        }

        .nav-item.active img {
            opacity: 1;
            transform: scale(1.05);
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #333;
            background-size: cover;
            background-position: center;
            opacity: 0.4;
            transition: opacity 0.3s;
        }

        .active .avatar {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="header" id="title">FOR YOU</div>

    <div class="content-area"></div>

    <div class="nav-wrapper">
        <div class="nav-island">
            <div class="blob" id="blob"></div>
            
            <div class="nav-item" id="tab-0" onclick="move(0)">
                <img src="https://cdn-icons-png.flaticon.com/512/6997/6997164.png" alt="home">
            </div>
            
            <div class="nav-item" id="tab-1" onclick="move(1)">
                <img src="https://cdn-icons-png.flaticon.com/512/8025/8025278.png" alt="search">
            </div>
            
            <div class="nav-item" id="tab-2" onclick="move(2)">
                <div class="avatar" id="pfp"></div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        
        // Настройки Fullscreen для 2026
        tg.ready();
        tg.expand();
        if (tg.requestFullscreen) {
            tg.requestFullscreen();
        }

        const blob = document.getElementById('blob');
        const items = document.querySelectorAll('.nav-item');
        let currentIndex = -1; // Чтобы первая отрисовка сработала корректно

        function move(index) {
            const targetItem = document.getElementById(`tab-${index}`);
            
            // Если нажали на ту же вкладку — случайная деформация (Chaos Splash)
            if (index === currentIndex) {
                const r = () => Math.floor(Math.random() * 50 + 25); // Случайные 25-75%
                blob.style.borderRadius = `${r()}% ${100-r()}% ${r()}% ${100-r()}% / ${100-r()}% ${r()}% ${100-r()}% ${r()}%`;
                blob.style.transform = `scale(1.1) rotate(${Math.random() * 10 - 5}deg)`;
                
                setTimeout(() => {
                    blob.style.borderRadius = '50%';
                    blob.style.transform = 'scale(1) rotate(0deg)';
                }, 350);
                
                tg.HapticFeedback.notificationOccurred('success');
                return;
            }

            // Обычное движение
            items.forEach(item => item.classList.remove('active'));
            blob.classList.remove('stretch-right', 'stretch-left');

            // Не анимируем растяжение при самой первой загрузке
            if (currentIndex !== -1) {
                if (index > currentIndex) {
                    blob.classList.add('stretch-right');
                } else {
                    blob.classList.add('stretch-left');
                }
            }

            // Точный расчет позиции
            const targetX = targetItem.offsetLeft + (targetItem.offsetWidth / 2) - (blob.offsetWidth / 2);
            blob.style.left = `${targetX}px`;
            
            targetItem.classList.add('active');
            currentIndex = index;

            // Возврат формы
            setTimeout(() => {
                blob.classList.remove('stretch-right', 'stretch-left');
            }, 250);

            // Виброотклик
            if (currentIndex !== -1) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }

        // Локализация
        const lang = tg.initDataUnsafe.user?.language_code || 'en';
        const t = { ru: "ДЛЯ ТЕБЯ", zh: "为你推荐", en: "FOR YOU" };
        document.getElementById('title').innerText = t[lang] || t.en;

        // Аватар
        if (tg.initDataUnsafe.user?.photo_url) {
            document.getElementById('pfp').style.backgroundImage = `url(${tg.initDataUnsafe.user.photo_url})`;
        }

        // Мягкий старт
        window.onload = () => {
            setTimeout(() => move(0), 50);
        };
    </script>
</body>
</html>
