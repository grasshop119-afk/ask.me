<style>
    .feed-container {
        flex: 1;
        overflow-y: auto;
        padding: 0 15px;
        /* Скрываем скроллбар */
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    .feed-container::-webkit-scrollbar { display: none; }

    /* Блок сторис */
    .stories-row {
        display: flex;
        gap: 12px;
        padding: 10px 0 20px;
        overflow-x: auto;
    }
    .story-card {
        min-width: 85px;
        height: 120px;
        background: #1a1a1a;
        border-radius: 20px;
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.05);
    }
    .story-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
    .story-name {
        position: absolute;
        bottom: 8px;
        left: 8px;
        font-size: 10px;
        font-weight: 600;
    }

    /* Основной пост */
    .post-card {
        background: #111;
        border-radius: 28px;
        margin-bottom: 15px;
        padding: 15px;
        border: 1px solid rgba(255,255,255,0.03);
    }
    .post-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
    }
    .post-avatar { width: 35px; height: 35px; border-radius: 50%; background: #333; }
    .post-image {
        width: 100%;
        aspect-ratio: 1/1;
        background: #1a1a1a;
        border-radius: 20px;
        margin-bottom: 12px;
        object-fit: cover;
    }
    .post-actions {
        display: flex;
        justify-content: space-between;
        padding: 0 5px;
    }
    .action-group { display: flex; gap: 15px; color: rgba(255,255,255,0.6); font-size: 14px; }
</style>

<div class="feed-container">
    <div class="stories-row">
        <div class="story-card" style="border: 2px solid var(--tg-accent);">
            <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:24px;">+</div>
            <span class="story-name">Add Story</span>
        </div>
        <div class="story-card"><img src="https://picsum.photos/200/300?1"><span class="story-name">Alex</span></div>
        <div class="story-card"><img src="https://picsum.photos/200/300?2"><span class="story-name">Maria</span></div>
        <div class="story-card"><img src="https://picsum.photos/200/300?3"><span class="story-name">Studio</span></div>
    </div>

    <div class="post-card">
        <div class="post-header">
            <div class="post-avatar" style="background-image: url('https://picsum.photos/100'); background-size: cover;"></div>
            <div>
                <div style="font-weight: 700; font-size: 15px;">design_flow</div>
                <div style="font-size: 11px; opacity: 0.5;">2 hours ago</div>
            </div>
        </div>
        <img class="post-image" src="https://picsum.photos/500/500?random=1">
        <div class="post-actions">
            <div class="action-group">
                <span>❤️ 2.4k</span>
                <span>💬 128</span>
            </div>
            <div style="opacity: 0.5;">✈️</div>
        </div>
    </div>
</div>
