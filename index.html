<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #000000);
            --tg-accent: var(--tg-theme-button-color, #007AFF);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --nav-bg: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 45px 25px 10px;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: -1.5px;
            text-transform: uppercase;
        }

        /* Навигация */
        .nav-wrapper {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .nav-island {
            position: relative;
            width: 220px; /* Сделали уже */
            height: 54px;  /* Компактнее */
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Пластилиновый Blob */
        .blob {
            position: absolute;
            left: 8px;
            width: 40px;
            height: 40px;
            background: var(--tg-accent);
            border-radius: 50%;
            z-index: 0;
            /* Плавность движения и формы */
            transition: 
                left 0.6s cubic-bezier(0.23, 1, 0.32, 1),
                border-radius 0.4s ease,
                transform 0.4s ease;
        }

        /* Деформация в движении - мягкая */
        .blob.stretching {
            border-radius: 35% 65% 65% 35% / 50% 50% 50% 50%;
            transform: scaleX(1.15);
        }

        .nav-item {
            width: 60px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item img {
            width: 22px;
            height: 22px;
            transition: opacity 0.3s ease;
            filter: invert(1);
            opacity: 0.3;
        }

        .nav-item.active img {
            opacity: 1;
        }

        /* Аватарка без контура */
        .avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background-color: #333;
            background-size: cover;
            background-position: center;
            opacity: 0.4;
            transition: opacity 0.3s ease;
        }

        .active .avatar {
            opacity: 1;
        }

        /* Лента */
        .story-container {
            flex: 1;
            margin: 10px 20px 100px;
            background: linear-gradient(180deg, #111, #000);
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <div class="header" id="title">FOR YOU</div>

    <div class="story-container">
        <span>Content View</span>
    </div>

    <div class="nav-wrapper">
        <div class="nav-island">
            <div class="blob" id="blob"></div>
            
            <div class="nav-item active" onclick="move(this, 0)">
                <img src="https://cdn-icons-png.flaticon.com/512/6997/6997164.png" alt="home">
            </div>
            
            <div class="nav-item" onclick="move(this, 1)">
                <img src="https://cdn-icons-png.flaticon.com/512/8025/8025278.png" alt="search">
            </div>
            
            <div class="nav-item" onclick="move(this, 2)">
                <div class="avatar" id="pfp"></div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const blob = document.getElementById('blob');
        const items = document.querySelectorAll('.nav-item');

        function move(el, index) {
            items.forEach(item => item.classList.remove('active'));
            el.classList.add('active');

            // Расчет позиции блоба
            // Ширина острова (220) минус паддинги и размер блоба
            const step = (220 - 16 - 40) / 2;
            const xPos = 8 + (index * step);

            // Анимация растяжения
            blob.classList.add('stretching');
            blob.style.left = `${xPos}px`;

            // Возвращаем форму после завершения движения
            setTimeout(() => {
                blob.classList.remove('stretching');
            }, 400);

            tg.HapticFeedback.impactOccurred('light');
        }

        // Локализация
        const lang = tg.initDataUnsafe.user?.language_code || 'en';
        const t = { ru: "ДЛЯ ТЕБЯ", zh: "为你推荐", en: "FOR YOU" };
        document.getElementById('title').innerText = t[lang] || t.en;

        // Аватар
        if (tg.initDataUnsafe.user?.photo_url) {
            document.getElementById('pfp').style.backgroundImage = `url(${tg.initDataUnsafe.user.photo_url})`;
        }
    </script>
</body>
</html>
