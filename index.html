<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #000000);
            --tg-accent: var(--tg-theme-button-color, #007AFF);
            --tg-secondary: var(--tg-theme-secondary-bg-color, #1c1c1d);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --tg-hint: var(--tg-theme-hint-color, #999999);
            
            /* Безопасные зоны для Fullscreen */
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --tg-top-safe-area: 60px; /* Отступ под системные кнопки TG */
            
            --nav-bg: rgba(28, 28, 30, 0.85);
            --border-style: 1px solid rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Запрещаем скролл всему body */
        }

        /* --- ЗАКРЕПЛЕННЫЙ ВЕРХ --- */
        .fixed-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 2000;
            background: var(--tg-bg);
            padding-top: var(--safe-top);
        }

        .header-container {
            padding: var(--tg-top-safe-area) 25px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1.2px;
            text-transform: uppercase;
        }

        .stories-line {
            display: flex;
            overflow-x: auto;
            padding: 10px 0 20px 20px;
            gap: 15px;
            scrollbar-width: none;
            border-bottom: var(--border-style);
        }
        .stories-line::-webkit-scrollbar { display: none; }

        /* --- СКРОЛЛ-ЗОНА КОНТЕНТА --- */
        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding: calc(var(--safe-top) + var(--tg-top-safe-area) + 140px) 16px calc(var(--safe-bottom) + 120px);
            -webkit-overflow-scrolling: touch;
        }

        /* --- СТОРИС-КАРТОЧКИ --- */
        .story-card {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 14;
            background: var(--tg-secondary);
            border-radius: 35px;
            overflow: hidden;
            margin-bottom: 20px;
            border: var(--border-style);
        }

        .story-card img.media {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 50%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 25px;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .author-name { font-weight: 800; font-size: 18px; margin-bottom: 5px; display: block; }
        .caption { font-size: 14px; opacity: 0.8; }

        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .action-btn img { width: 30px; height: 30px; filter: invert(1); }
        .action-btn span { font-size: 12px; font-weight: 700; }

        /* --- ВОССТАНОВЛЕННЫЙ ПОДВАЛ (ПЛАСТИЛИН) --- */
        .nav-wrapper {
            position: fixed;
            bottom: calc(30px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 3000;
        }

        .nav-island {
            position: relative;
            width: 240px;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            border: var(--border-style);
        }

        .blob {
            position: absolute;
            width: 46px;
            height: 46px;
            background: var(--tg-accent);
            border-radius: 50%;
            z-index: 0;
            top: 50%;
            margin-top: -23px;
            left: 15px;
            transition: left 0.5s cubic-bezier(0.19, 1, 0.22, 1), 
                        border-radius 0.3s ease, 
                        transform 0.3s ease;
        }

        .stretch-right {
            border-radius: 40% 70% 70% 40% / 50% 50% 50% 50% !important;
            transform: scaleX(1.2) !important;
        }

        .stretch-left {
            border-radius: 70% 40% 40% 70% / 50% 50% 50% 50% !important;
            transform: scaleX(1.2) !important;
        }

        .nav-item {
            position: relative;
            width: 50px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item img {
            width: 26px;
            height: 26px;
            filter: invert(1);
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        .nav-item.active img { opacity: 1; }

        .profile-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #333;
            background-size: cover;
            background-position: center;
            opacity: 0.4;
        }
        .active .profile-avatar { opacity: 1; }

        /* Элементы Сториз в шапке */
        .story-node { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 70px; }
        .ring { width: 64px; height: 64px; border-radius: 22px; padding: 2px; background: linear-gradient(45deg, var(--tg-accent), #a336ff); display: flex; align-items: center; justify-content: center; }
        .avatar-img { width: 58px; height: 58px; border-radius: 20px; background: var(--tg-secondary); border: 2px solid var(--tg-bg); object-fit: cover; }
        .user-label { font-size: 10px; font-weight: 600; opacity: 0.7; }

    </style>
</head>
<body>

    <div class="fixed-top">
        <div class="header-container">
            <div class="header" id="title">ДЛЯ ТЕБЯ</div>
        </div>
        <div class="stories-line" id="contacts-line">
            <div class="story-node">
                <div class="ring"><div class="avatar-img" id="my-pfp"></div></div>
                <div class="user-label">Вы</div>
            </div>
            </div>
    </div>

    <div class="scrollable-content" id="feed">
        </div>

    <div class="nav-wrapper">
        <div class="nav-island">
            <div class="blob" id="blob"></div>
            <div class="nav-item active" id="tab-0" onclick="move(0)">
                <img src="https://cdn-icons-png.flaticon.com/512/6997/6997164.png" alt="home">
            </div>
            <div class="nav-item" id="tab-1" onclick="move(1)">
                <img src="https://cdn-icons-png.flaticon.com/512/8025/8025278.png" alt="search">
            </div>
            <div class="nav-item" id="tab-2" onclick="move(2)">
                <div class="profile-avatar" id="nav-pfp"></div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        if (tg.requestFullscreen) tg.requestFullscreen();

        tg.SettingsButton.show();

        // 1. Синхронизация данных
        const user = tg.initDataUnsafe.user;
        if (user?.photo_url) {
            document.getElementById('nav-pfp').style.backgroundImage = `url(${user.photo_url})`;
            document.getElementById('my-pfp').style.backgroundImage = `url(${user.photo_url})`;
        }

        // 2. Генерация реалистичных контактов
        const contactsLine = document.getElementById('contacts-line');
        for(let i=0; i<10; i++) {
            contactsLine.innerHTML += `
                <div class="story-node">
                    <div class="ring" style="background: ${i > 3 ? 'rgba(255,255,255,0.1)' : ''}">
                        <img class="avatar-img" src="https://i.pravatar.cc/150?u=user${i}">
                    </div>
                    <div class="user-label">Контакт ${i+1}</div>
                </div>
            `;
        }

        // 3. Контент ленты
        const feedData = [
            { name: "Julian", text: "Sunset vibes", img: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800", likes: "1.2k" },
            { name: "Maria", text: "City lights", img: "https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=800", likes: "5.6k" }
        ];

        const feed = document.getElementById('feed');
        feedData.forEach(item => {
            feed.innerHTML += `
                <div class="story-card">
                    <img src="${item.img}" class="media">
                    <div class="card-overlay">
                        <div class="card-bottom">
                            <div class="info">
                                <span class="author-name">${item.name}</span>
                                <span class="caption">${item.text}</span>
                            </div>
                            <div class="card-actions">
                                <div class="action-btn" onclick="tg.HapticFeedback.impactOccurred('heavy')">
                                    <img src="https://cdn-icons-png.flaticon.com/512/7754/7754213.png">
                                    <span>${item.likes}</span>
                                </div>
                                <div class="action-btn">
                                    <img src="https://cdn-icons-png.flaticon.com/512/6997/6997415.png">
                                    <span>12</span>
                                </div>
                                <div class="action-btn share-btn" onclick="tg.HapticFeedback.impactOccurred('medium')">
                                    <img src="https://cdn-icons-png.flaticon.com/512/2550/2550240.png">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });

        // 4. Логика таббара (Тот самый "Пластилин")
        const blob = document.getElementById('blob');
        const items = document.querySelectorAll('.nav-item');
        let currentIndex = 0;

        function move(index) {
            const targetItem = document.getElementById(`tab-${index}`);
            
            if (index === currentIndex) {
                const r = () => Math.floor(Math.random() * 8 + 46); 
                blob.style.borderRadius = `${r()}% ${100-r()}% ${r()}% ${100-r()}% / ${100-r()}% ${r()}% ${100-r()}% ${r()}%`;
                blob.style.transform = `scale(1.04)`;
                setTimeout(() => { blob.style.borderRadius = ''; blob.style.transform = ''; }, 200);
                tg.HapticFeedback.notificationOccurred('success');
                return;
            }

            items.forEach(item => item.classList.remove('active'));
            blob.classList.remove('stretch-right', 'stretch-left');

            if (index > currentIndex) blob.classList.add('stretch-right');
            else blob.classList.add('stretch-left');

            const targetX = targetItem.offsetLeft + (targetItem.offsetWidth / 2) - (blob.offsetWidth / 2);
            blob.style.left = `${targetX}px`;
            
            targetItem.classList.add('active');
            currentIndex = index;

            setTimeout(() => {
                blob.classList.remove('stretch-right', 'stretch-left');
            }, 200);

            tg.HapticFeedback.impactOccurred('medium');
        }

        window.onload = () => move(0);
    </script>
</body>
</html>
