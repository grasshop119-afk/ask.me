<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #000000);
            --tg-accent: var(--tg-theme-button-color, #007AFF);
            --tg-secondary: var(--tg-theme-secondary-bg-color, #1c1c1d);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --header-h: 120px;
        }

        body {
            margin: 0;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: -apple-system, system-ui, sans-serif;
            overflow: hidden;
            touch-action: none; /* Контролируем свайпы сами */
        }

        /* --- PULL TO REFRESH LAYER --- */
        #ptr-indicator {
            position: absolute;
            top: calc(var(--safe-top) + 20px);
            left: 50%;
            transform: translateX(-50%) translateY(-50px);
            transition: transform 0.2s cubic-bezier(0,0,0.2,1);
            z-index: 5;
        }

        /* --- FIXED DYNAMIC HEADER --- */
        .header-fixed {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--tg-bg);
            padding: calc(var(--safe-top) + 40px) 25px 20px;
            transition: transform 0.1s linear;
        }

        .header-fixed h1 {
            margin: 0;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: -2px;
            transform-origin: left center;
        }

        /* --- STORIES: THE BUBBLE TRACK --- */
        .stories-track {
            padding: 10px 0 25px 20px;
            display: flex;
            gap: 18px;
            overflow-x: auto;
            scrollbar-width: none;
            background: var(--tg-bg);
        }
        .stories-track::-webkit-scrollbar { display: none; }

        .bubble {
            position: relative;
            min-width: 65px;
            text-align: center;
        }

        .bubble-frame {
            width: 65px;
            height: 65px;
            border-radius: 24px;
            background: var(--tg-secondary);
            border: 1.5px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .bubble:active .bubble-frame { transform: scale(0.9); }

        /* Метка Online — чисто механика ТГ */
        .online-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 14px;
            height: 14px;
            background: #31d158;
            border: 3px solid var(--tg-bg);
            border-radius: 50%;
            z-index: 10;
        }

        /* --- THE STACK CONTENT (MAIN FEED) --- */
        #scroll-container {
            height: 100vh;
            overflow-y: scroll;
            padding-top: calc(var(--header-h) + var(--safe-top) + 110px);
            padding-bottom: 200px;
            transition: transform 0.1s linear;
        }

        .stack-tile {
            margin: 0 16px 25px;
            background: var(--tg-secondary);
            border-radius: 30px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }

        .tile-media {
            width: 100%;
            min-height: 300px;
            max-height: 500px;
            object-fit: cover;
            display: block;
        }

        .tile-glass {
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            position: absolute;
            bottom: 0;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tile-actions {
            display: flex;
            gap: 20px;
        }

        .tile-btn {
            background: none;
            border: none;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .tile-btn img {
            width: 26px;
            height: 26px;
            filter: invert(1);
        }

        /* --- NAVIGATION (PLASTICINE RESTORED) --- */
        .nav-wrapper {
            position: fixed;
            bottom: calc(30px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
        }

        .nav-island {
            width: 240px;
            height: 60px;
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .blob {
            position: absolute;
            width: 46px;
            height: 46px;
            background: var(--tg-accent);
            border-radius: 50%;
            left: 15px;
            transition: left 0.5s cubic-bezier(0.19, 1, 0.22, 1), border-radius 0.3s ease;
        }

        .nav-item { width: 50px; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 2; }
        .nav-item img, .profile-pfp { width: 26px; height: 26px; filter: invert(1); opacity: 0.3; transition: 0.3s; }
        .nav-item.active img, .nav-item.active .profile-pfp { opacity: 1; }
        .profile-pfp { border-radius: 50%; border: 1px solid #fff; }

        .stretch-right { border-radius: 40% 70% 70% 40% / 50% 50% 50% 50% !important; transform: scaleX(1.18); }
        .stretch-left { border-radius: 70% 40% 40% 70% / 50% 50% 50% 50% !important; transform: scaleX(1.18); }

    </style>
</head>
<body>

    <div id="ptr-indicator">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--tg-accent)" stroke-width="3" stroke-linecap="round">
            <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/>
        </svg>
    </div>

    <div class="header-fixed" id="header">
        <h1 id="header-text">ДЛЯ ТЕБЯ</h1>
        <div class="stories-track" id="stories">
            <div class="bubble">
                <div class="bubble-frame"><div id="my-avatar" style="width:100%;height:100%;background-size:cover;"></div></div>
                <div style="font-size:10px; margin-top:5px; font-weight:700;">Вы</div>
            </div>
        </div>
    </div>

    <div id="scroll-container">
        <div id="feed-stack"></div>
    </div>

    <div class="nav-wrapper">
        <div class="nav-island">
            <div class="blob" id="blob"></div>
            <div class="nav-item active" onclick="move(0, this)"><img src="https://cdn-icons-png.flaticon.com/512/6997/6997164.png"></div>
            <div class="nav-item" onclick="move(1, this)"><img src="https://cdn-icons-png.flaticon.com/512/8025/8025278.png"></div>
            <div class="nav-item" onclick="move(2, this)"><div class="profile-pfp" id="nav-pfp"></div></div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // --- ДИНАМИКА PULL-TO-REFRESH ---
        const container = document.getElementById('scroll-container');
        const headerText = document.getElementById('header-text');
        const ptr = document.getElementById('ptr-indicator');
        let startY = 0;

        container.addEventListener('touchstart', e => {
            if (container.scrollTop === 0) startY = e.touches[0].pageY;
        });

        container.addEventListener('touchmove', e => {
            const y = e.touches[0].pageY;
            const dist = y - startY;
            if (container.scrollTop === 0 && dist > 0) {
                const move = Math.pow(dist, 0.8);
                container.style.transform = `translateY(${move}px)`;
                headerText.style.transform = `scale(${1 + move/500})`;
                ptr.style.transform = `translateX(-50%) translateY(${move - 50}px) rotate(${move*2}deg)`;
                if (move > 70) tg.HapticFeedback.impactOccurred('light');
            }
        });

        container.addEventListener('touchend', () => {
            container.style.transform = '';
            headerText.style.transform = '';
            ptr.style.transform = 'translateX(-50%) translateY(-50px)';
            if (parseInt(container.style.transform.replace(/[^\d.]/g, '')) > 60) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        });

        // --- ГЕНЕРАЦИЯ СТЕКА (НЕ ИНСТА) ---
        const feedStack = document.getElementById('feed-stack');
        const samples = [
            "https://images.unsplash.com/photo-1614850523296-d8c1af93d400?w=800",
            "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=800",
            "https://images.unsplash.com/photo-1579546128127-b456567ec430?w=800"
        ];

        samples.forEach((img, i) => {
            feedStack.innerHTML += `
                <div class="stack-tile">
                    <img src="${img}" class="tile-media">
                    <div class="tile-glass">
                        <div style="font-weight:800; font-size:18px;">Abstract Flow #${i+1}</div>
                        <div class="tile-actions">
                            <button class="tile-btn" onclick="like(this)"><img src="https://cdn-icons-png.flaticon.com/512/7754/7754213.png"></button>
                            <button class="tile-btn"><img src="https://cdn-icons-png.flaticon.com/512/2550/2550240.png"></button>
                        </div>
                    </div>
                </div>
            `;
        });

        // --- TG SYNC ---
        const stories = document.getElementById('stories');
        for(let i=0; i<8; i++) {
            stories.innerHTML += `
                <div class="bubble">
                    <div class="bubble-frame"><img src="https://i.pravatar.cc/100?u=${i}" style="width:100%"></div>
                    ${i % 3 === 0 ? '<div class="online-badge"></div>' : ''}
                    <div style="font-size:10px; margin-top:5px; opacity:0.6;">User ${i}</div>
                </div>
            `;
        }

        const user = tg.initDataUnsafe.user;
        if (user?.photo_url) {
            document.getElementById('my-avatar').style.backgroundImage = `url(${user.photo_url})`;
            document.getElementById('nav-pfp').style.backgroundImage = `url(${user.photo_url})`;
        }

        // --- КУЛЬТОВЫЙ ТАББАР ---
        const blob = document.getElementById('blob');
        let currentIdx = 0;

        function move(index, el) {
            if (index === currentIdx) {
                tg.HapticFeedback.notificationOccurred('success');
                return;
            }
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            
            blob.classList.remove('stretch-right', 'stretch-left');
            blob.classList.add(index > currentIdx ? 'stretch-right' : 'stretch-left');
            
            blob.style.left = `${el.offsetLeft + (el.offsetWidth/2) - 23}px`;
            currentIdx = index;
            
            setTimeout(() => blob.classList.remove('stretch-right', 'stretch-left'), 300);
            tg.HapticFeedback.impactOccurred('medium');
        }

        function like(el) {
            tg.HapticFeedback.impactOccurred('heavy');
            el.style.filter = "drop-shadow(0 0 10px var(--tg-accent))";
        }
    </script>
</body>
</html>
