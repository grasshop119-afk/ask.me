<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #000000);
            --tg-accent: var(--tg-theme-button-color, #007AFF);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --nav-bg: rgba(28, 28, 30, 0.8);
        }

        body {
            margin: 0;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            padding: 45px 25px 15px;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: -1.5px;
            text-transform: uppercase;
        }

        /* Контейнер навигации */
        .nav-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .nav-capsule {
            position: relative;
            width: 260px; /* Чуть шире для расстояния между иконками */
            height: 60px;  /* Чуть меньше рост */
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 0 10px;
        }

        /* Пластилиновый круг */
        .nav-blob {
            position: absolute;
            top: 8px;
            left: 12px;
            width: 44px;
            height: 44px;
            background: var(--tg-accent);
            border-radius: 50%;
            z-index: -1;
            /* Плавное движение с инерцией */
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        /* Эффект деформации при движении */
        .nav-blob.moving {
            border-radius: 40% 60% 60% 40% / 40% 40% 60% 60%;
            transform: scaleX(1.2);
        }

        .nav-item {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* Иконки (используем надежные PNG-аналоги твоих иконок) */
        .nav-item img {
            width: 24px; /* Чуть мельче */
            height: 24px;
            transition: 0.3s;
            filter: invert(1) opacity(0.4);
            z-index: 2;
        }

        .nav-item.active img {
            filter: invert(1) opacity(1);
            transform: scale(1.1);
        }

        .avatar-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #444;
            background-size: cover;
            border: 2px solid rgba(255,255,255,0.2);
            transition: 0.3s;
        }

        .active .avatar-circle {
            border-color: #fff;
        }

        /* Лента */
        .feed {
            height: 70vh;
            margin: 0 20px;
            background: linear-gradient(145deg, #111, #000);
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            opacity: 0.5;
            border: 1px solid #222;
        }
    </style>
</head>
<body>

    <div class="header" id="h-title">FOR YOU</div>

    <div class="feed">
        [ Story Content ]
    </div>

    <div class="nav-container">
        <div class="nav-capsule">
            <div class="nav-blob" id="blob"></div>

            <div class="nav-item active" onclick="moveBlob(this, 0)">
                <img src="https://cdn-icons-png.flaticon.com/512/1946/1946436.png" alt="home">
            </div>
            <div class="nav-item" onclick="moveBlob(this, 1)">
                <img src="https://cdn-icons-png.flaticon.com/512/1150/1150612.png" alt="search">
            </div>
            <div class="nav-item" onclick="moveBlob(this, 2)">
                <div class="avatar-circle" id="user-avatar"></div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Локализация
        const texts = {
            ru: { title: "ДЛЯ ТЕБЯ" },
            en: { title: "FOR YOU" },
            zh: { title: "为你推荐" }
        };
        const lang = tg.initDataUnsafe.user?.language_code || 'en';
        document.getElementById('h-title').innerText = (texts[lang] || texts.en).title;

        // Логика пластилинового круга
        const blob = document.getElementById('blob');
        const items = document.querySelectorAll('.nav-item');

        function moveBlob(el, index) {
            // Убираем активный класс у всех
            items.forEach(item => item.classList.remove('active'));
            // Добавляем текущему
            el.classList.add('active');

            // Рассчитываем позицию (ширина капсулы / 3 секции)
            const sectionWidth = 260 / 3;
            const targetPos = (sectionWidth * index) + (sectionWidth / 2) - 22 + 10; 
            // 22 - это половина ширины блоба (44/2), 10 - компенсация паддинга

            // Эффект "деформации"
            blob.classList.add('moving');
            blob.style.left = `${targetPos}px`;

            // Убираем деформацию после окончания прыжка
            setTimeout(() => {
                blob.classList.remove('moving');
            }, 500);

            tg.HapticFeedback.impactOccurred('medium');
        }

        // Ставим аватар
        if (tg.initDataUnsafe.user?.photo_url) {
            document.getElementById('user-avatar').style.backgroundImage = `url(${tg.initDataUnsafe.user.photo_url})`;
        }

        // Инициализация позиции
        moveBlob(items[0], 0);
    </script>
</body>
</html>
