<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #000000);
            --tg-accent: var(--tg-theme-button-color, #007AFF);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --nav-bg: rgba(255, 255, 255, 0.12);
        }

        body {
            margin: 0;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 45px 25px 10px;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: -1.5px;
            text-transform: uppercase;
        }

        .nav-wrapper {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            justify-content: center;
        }

        /* Кнопка ПЛЮС (Акцентный Squircle) */
        .plus-btn {
            position: absolute;
            top: -24px;
            width: 62px;
            height: 62px;
            background: var(--tg-accent);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .plus-btn img { width: 30px; height: 30px; filter: invert(1); }

        /* Остров с плавным вырезом сверху */
        .nav-island {
            position: relative;
            width: 320px;
            height: 58px;
            background: var(--nav-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            border: 1px solid rgba(255,255,255,0.08);
            /* Магия "продавливания" через маску */
            mask: radial-gradient(circle 42px at 50% -5px, transparent 100%, #000 100%);
            -webkit-mask: radial-gradient(circle 42px at 50% -5px, transparent 99%, #000 100%);
        }

        .blob {
            position: absolute;
            width: 46px;
            height: 46px;
            background: var(--tg-accent);
            border-radius: 50%;
            z-index: 0;
            top: 6px;
            left: 50%; /* Стартовая позиция для анимации появления */
            transform: translateX(-50%) scale(0);
            transition: left 0.5s cubic-bezier(0.19, 1, 0.22, 1), 
                        border-radius 0.3s ease, 
                        transform 0.4s ease;
        }

        .stretch-right { border-radius: 40% 70% 70% 40% / 50% 50% 50% 50%; transform: scaleX(1.25); }
        .stretch-left { border-radius: 70% 40% 40% 70% / 50% 50% 50% 50%; transform: scaleX(1.25); }

        .nav-item {
            position: relative;
            width: 50px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .spacer { width: 64px; pointer-events: none; }

        .nav-item img, .avatar {
            width: 24px;
            height: 24px;
            filter: invert(1);
            opacity: 0.3;
            transition: opacity 0.3s, transform 0.2s;
        }

        .nav-item.active img, .nav-item.active .avatar {
            opacity: 1;
            transform: scale(1.1);
        }

        .avatar {
            border-radius: 50%;
            background-color: #333;
            background-size: cover;
        }

        .content-placeholder {
            flex: 1;
            margin: 15px 20px 110px;
            background: linear-gradient(180deg, #121212 0%, #000 100%);
            border-radius: 40px;
        }
    </style>
</head>
<body>

    <div class="header" id="title">FOR YOU</div>
    <div class="content-placeholder"></div>

    <div class="nav-wrapper">
        <div class="plus-btn" onclick="tg.HapticFeedback.impactOccurred('heavy')">
            <img src="https://cdn-icons-png.flaticon.com/512/9199/9199638.png" alt="plus">
        </div>

        <div class="nav-island">
            <div class="blob" id="blob"></div>
            
            <div class="nav-item" id="tab-0" onclick="move(0)">
                <img src="https://cdn-icons-png.flaticon.com/512/6997/6997164.png" alt="home">
            </div>
            
            <div class="nav-item" id="tab-1" onclick="move(1)">
                <img src="https://cdn-icons-png.flaticon.com/512/8025/8025278.png" alt="search">
            </div>

            <div class="spacer"></div>

            <div class="nav-item" id="tab-2" onclick="move(2)">
                <img src="https://cdn-icons-png.flaticon.com/512/8138/8138685.png" alt="friends">
            </div>
            
            <div class="nav-item" id="tab-3" onclick="move(3)">
                <div class="avatar" id="pfp"></div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const blob = document.getElementById('blob');
        const items = document.querySelectorAll('.nav-item');
        let currentIndex = -1; // -1 чтобы первая анимация всегда срабатывала

        function move(index) {
            const targetItem = document.getElementById(`tab-${index}`);
            
            if (index === currentIndex) {
                // Тот самый случайный хаос при нажатии на ту же вкладку
                const r = () => Math.floor(Math.random() * 60 + 20);
                blob.style.borderRadius = `${r()}% ${r()}% ${r()}% ${r()}% / ${r()}% ${r()}% ${r()}% ${r()}%`;
                setTimeout(() => blob.style.borderRadius = '50%', 300);
                tg.HapticFeedback.notificationOccurred('success');
                return;
            }

            items.forEach(item => item.classList.remove('active'));
            blob.classList.remove('stretch-right', 'stretch-left');

            if (currentIndex !== -1) {
                if (index > currentIndex) blob.classList.add('stretch-right');
                else blob.classList.add('stretch-left');
            }

            // Позиционирование
            const targetX = targetItem.offsetLeft + (targetItem.offsetWidth / 2) - (blob.offsetWidth / 2);
            blob.style.left = `${targetX}px`;
            blob.style.transform = 'scale(1)'; // Убеждаемся что он виден
            
            targetItem.classList.add('active');
            currentIndex = index;

            setTimeout(() => {
                blob.classList.remove('stretch-right', 'stretch-left');
            }, 250);

            tg.HapticFeedback.impactOccurred('medium');
        }

        // Старт приложения
        window.onload = () => {
            // Маленькая задержка для красоты
            setTimeout(() => move(0), 100);
        };

        const lang = tg.initDataUnsafe.user?.language_code || 'en';
        const t = { ru: "ДЛЯ ТЕБЯ", zh: "为你推荐", en: "FOR YOU" };
        document.getElementById('title').innerText = t[lang] || t.en;

        if (tg.initDataUnsafe.user?.photo_url) {
            document.getElementById('pfp').style.backgroundImage = `url(${tg.initDataUnsafe.user.photo_url})`;
        }
    </script>
</body>
</html>
