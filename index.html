<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #000000);
            --tg-accent: var(--tg-theme-button-color, #007AFF);
            --tg-secondary: var(--tg-theme-secondary-bg-color, #1c1c1d);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --tg-hint: var(--tg-theme-hint-color, #999999);
            /* Увеличенный отступ для режима Fullsize */
            --tg-header-gap: 85px; 
            --nav-bg: rgba(28, 28, 30, 0.85);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --border-style: 1px solid rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- ФИКСИРОВАННАЯ ШАПКА --- */
        .header-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 2000;
            background: linear-gradient(to bottom, var(--tg-bg) 80%, transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(var(--safe-top) + 20px) 25px 20px;
        }

        .header {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        /* --- КОНТЕНТ --- */
        .main-content {
            padding-top: var(--tg-header-gap);
            padding-bottom: calc(var(--safe-bottom) + 120px);
        }

        /* --- СТОРИС КОНТАКТОВ --- */
        .stories-line {
            display: flex;
            overflow-x: auto;
            padding: 10px 0 25px 20px;
            gap: 15px;
            scrollbar-width: none;
        }
        .stories-line::-webkit-scrollbar { display: none; }

        .story-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-width: 72px;
        }

        .ring {
            width: 68px;
            height: 68px;
            border-radius: 25px; /* Квадрат со скруглением в стиле TG */
            padding: 2px;
            background: linear-gradient(45deg, var(--tg-accent), #a336ff);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring.seen { background: rgba(255,255,255,0.15); }

        .avatar-img {
            width: 62px;
            height: 62px;
            border-radius: 22px;
            background: var(--tg-secondary);
            border: 2px solid var(--tg-bg);
            object-fit: cover;
        }

        .user-label {
            font-size: 11px;
            color: var(--tg-text);
            font-weight: 500;
            opacity: 0.8;
        }

        /* --- СТОРИС-КАРТОЧКИ (ЛЕНТА) --- */
        .story-feed {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .story-card {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 14; /* Вертикальный формат сторис */
            background: var(--tg-secondary);
            border-radius: 32px;
            overflow: hidden;
            border: var(--border-style);
        }

        .story-card img.media {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 40%, rgba(0,0,0,0.4) 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .author-pfp {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .card-info .author-name {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 4px;
            display: block;
        }

        .card-info .caption {
            font-size: 13px;
            opacity: 0.7;
        }

        /* --- ИКОНКИ ДЕЙСТВИЙ --- */
        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            -webkit-tap-highlight-color: transparent;
        }

        .action-btn img {
            width: 28px;
            height: 28px;
            filter: invert(1);
        }

        .action-btn span {
            font-size: 11px;
            font-weight: 600;
        }

        /* Репост не темнеет при нажатии */
        .share-btn:active {
            opacity: 1 !important;
            transform: scale(1.1);
        }

        /* --- NAV ISLAND (ОБНОВЛЕННЫЙ) --- */
        .nav-wrapper {
            position: fixed;
            bottom: calc(20px + var(--safe-bottom)); /* Опустили ниже */
            left: 50%;
            transform: translateX(-50%);
            z-index: 3000;
        }

        .nav-island {
            position: relative;
            width: 240px;
            height: 64px;
            background: var(--nav-bg);
            backdrop-filter: blur(25px); /* Сильный блюр */
            -webkit-backdrop-filter: blur(25px);
            border-radius: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            border: var(--border-style);
        }

        .blob {
            position: absolute;
            width: 48px;
            height: 48px;
            background: var(--tg-accent);
            border-radius: 50%;
            z-index: 0;
            top: 50%;
            margin-top: -24px;
            left: 15px;
            transition: left 0.5s cubic-bezier(0.19, 1, 0.22, 1), border-radius 0.3s ease;
        }

        .nav-item {
            position: relative;
            width: 55px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .nav-item img {
            width: 26px;
            height: 26px;
            filter: invert(1);
            opacity: 0.35;
            transition: opacity 0.3s ease;
        }

        .nav-item.active img { opacity: 1; }

        .profile-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #333;
            background-size: cover;
            background-position: center;
            opacity: 0.4;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .active .profile-avatar { opacity: 1; border-color: #fff; }

        .stretch-right { border-radius: 40% 70% 70% 40% / 50% 50% 50% 50%; transform: scaleX(1.15); }
        .stretch-left { border-radius: 70% 40% 40% 70% / 50% 50% 50% 50%; transform: scaleX(1.15); }

    </style>
</head>
<body>

    <div class="header-container">
        <div class="header" id="title">ДЛЯ ТЕБЯ</div>
    </div>

    <div class="main-content">
        <div class="stories-line" id="contacts-stories">
            <div class="story-node">
                <div class="ring"><div class="avatar-img" id="my-story-pfp" style="background-size:cover;"></div></div>
                <div class="user-label">Ты</div>
            </div>
            </div>

        <div class="story-feed" id="main-feed">
            </div>
    </div>

    <div class="nav-wrapper">
        <div class="nav-island">
            <div class="blob" id="blob"></div>
            <div class="nav-item active" id="tab-0" onclick="move(0)">
                <img src="https://cdn-icons-png.flaticon.com/512/6997/6997164.png" alt="home">
            </div>
            <div class="nav-item" id="tab-1" onclick="move(1)">
                <img src="https://cdn-icons-png.flaticon.com/512/8025/8025278.png" alt="search">
            </div>
            <div class="nav-item" id="tab-2" onclick="move(2)">
                <div class="profile-avatar" id="nav-pfp"></div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        if (tg.requestFullscreen) tg.requestFullscreen();

        tg.SettingsButton.show();

        // Данные для ленты (формат Сторис)
        const content = [
            { user: "Aiden Raid", text: "New look #style", img: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=800", likes: "1.2k" },
            { user: "Oliver Bennet", text: "Morning in Tokyo", img: "https://images.unsplash.com/photo-1540959733332-e9ab42bd7d0b?w=800", likes: "8.4k" },
            { user: "Rose Oak", text: "Cooking vibe", img: "https://images.unsplash.com/photo-1556910103-1c02745aae4d?w=800", likes: "940" }
        ];

        const feed = document.getElementById('main-feed');
        content.forEach(item => {
            feed.innerHTML += `
                <div class="story-card">
                    <img src="${item.img}" class="media" loading="lazy">
                    <div class="card-overlay">
                        <div class="card-top">
                            <img src="https://i.pravatar.cc/100?u=${item.user}" class="author-pfp">
                            <span style="font-weight:600; font-size:14px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">${item.user}</span>
                        </div>
                        <div class="card-bottom">
                            <div class="card-info">
                                <span class="author-name">${item.user}</span>
                                <span class="caption">${item.text}</span>
                            </div>
                            <div class="card-actions">
                                <div class="action-btn" onclick="like(this)">
                                    <img src="https://cdn-icons-png.flaticon.com/512/7754/7754213.png">
                                    <span>${item.likes}</span>
                                </div>
                                <div class="action-btn">
                                    <img src="https://cdn-icons-png.flaticon.com/512/6997/6997415.png">
                                    <span>42</span>
                                </div>
                                <div class="action-btn share-btn" onclick="tg.HapticFeedback.impactOccurred('medium')">
                                    <img src="https://cdn-icons-png.flaticon.com/512/2550/2550240.png">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });

        // Контакты в сторис
        const contactBar = document.getElementById('contacts-stories');
        for(let i=1; i<10; i++) {
            contactBar.innerHTML += `
                <div class="story-node">
                    <div class="ring viewed"><img class="avatar-img" src="https://i.pravatar.cc/150?img=${i+20}"></div>
                    <div class="user-label">Contact ${i}</div>
                </div>
            `;
        }

        // Логика таббара
        const blob = document.getElementById('blob');
        const items = document.querySelectorAll('.nav-item');
        let currentIndex = 0;

        function move(index) {
            const targetItem = document.getElementById(`tab-${index}`);
            if (index === currentIndex) {
                tg.HapticFeedback.notificationOccurred('success');
                return;
            }
            items.forEach(item => item.classList.remove('active'));
            blob.classList.remove('stretch-right', 'stretch-left');
            if (index > currentIndex) blob.classList.add('stretch-right');
            else blob.classList.add('stretch-left');
            
            const targetX = targetItem.offsetLeft + (targetItem.offsetWidth / 2) - (blob.offsetWidth / 2);
            blob.style.left = `${targetX}px`;
            targetItem.classList.add('active');
            currentIndex = index;
            setTimeout(() => blob.classList.remove('stretch-right', 'stretch-left'), 200);
            tg.HapticFeedback.impactOccurred('medium');
        }

        function like(el) {
            tg.HapticFeedback.impactOccurred('heavy');
            el.style.color = '#ff3b30';
            el.querySelector('img').style.filter = 'none';
        }

        // Установка аватара пользователя TG
        const userPhoto = tg.initDataUnsafe.user?.photo_url;
        if (userPhoto) {
            document.getElementById('nav-pfp').style.backgroundImage = `url(${userPhoto})`;
            document.getElementById('my-story-pfp').style.backgroundImage = `url(${userPhoto})`;
        } else {
            document.getElementById('nav-pfp').style.backgroundColor = 'var(--tg-accent)';
            document.getElementById('my-story-pfp').style.backgroundColor = 'var(--tg-accent)';
        }

        window.onload = () => move(0);
    </script>
</body>
</html>
