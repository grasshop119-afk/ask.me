<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #000000);
            --tg-accent: var(--tg-theme-button-color, #007AFF);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --nav-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 45px 25px 10px;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: -1.5px;
            text-transform: uppercase;
        }

        .nav-wrapper {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        /* Меню с "прогибом" под плюс */
        .nav-island {
            position: relative;
            width: 320px;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            border: 1px solid rgba(255,255,255,0.05);
            /* Магия прогиба через clip-path или mask (упростим для стабильности) */
        }

        /* Кнопка ПЛЮС (Акцентный Squircle) */
        .plus-btn {
            position: absolute;
            top: -20px; /* Выпирает наполовину */
            left: 50%;
            transform: translateX(-50%);
            width: 58px;
            height: 58px;
            background: var(--tg-accent);
            border-radius: 20px; /* Тот самый мягкий квадрат */
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            z-index: 10;
            cursor: pointer;
        }

        .plus-btn img {
            width: 28px;
            height: 28px;
            filter: invert(1);
        }

        /* Блоб */
        .blob {
            position: absolute;
            width: 44px;
            height: 44px;
            background: var(--tg-accent);
            border-radius: 50%;
            z-index: 0;
            transition: left 0.5s cubic-bezier(0.19, 1, 0.22, 1), 
                        border-radius 0.3s ease, 
                        transform 0.3s ease;
        }

        .stretch-right { border-radius: 40% 70% 70% 40% / 50% 50% 50% 50%; transform: scaleX(1.25); }
        .stretch-left { border-radius: 70% 40% 40% 70% / 50% 50% 50% 50%; transform: scaleX(1.25); }

        .nav-item {
            position: relative;
            width: 50px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* Пропуск места под плюс */
        .spacer { width: 60px; pointer-events: none; }

        .nav-item img {
            width: 22px;
            height: 22px;
            filter: invert(1);
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        .nav-item.active img { opacity: 1; }

        .avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background-color: #333;
            background-size: cover;
            opacity: 0.4;
        }
        .active .avatar { opacity: 1; }

        .content-area {
            flex: 1;
            margin: 10px 20px 100px;
            background: linear-gradient(180deg, #111, #000);
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <div class="header" id="title">FOR YOU</div>

    <div class="content-area"></div>

    <div class="nav-wrapper">
        <div class="plus-btn" onclick="tg.HapticFeedback.impactOccurred('heavy')">
            <img src="https://cdn-icons-png.flaticon.com/512/9199/9199638.png" alt="plus">
        </div>

        <div class="nav-island">
            <div class="blob" id="blob"></div>
            
            <div class="nav-item active" id="tab-0" onclick="move(0)">
                <img src="https://cdn-icons-png.flaticon.com/512/6997/6997164.png" alt="home">
            </div>
            
            <div class="nav-item" id="tab-1" onclick="move(1)">
                <img src="https://cdn-icons-png.flaticon.com/512/8025/8025278.png" alt="search">
            </div>

            <div class="spacer"></div>

            <div class="nav-item" id="tab-2" onclick="move(2)">
                <img src="https://cdn-icons-png.flaticon.com/512/8138/8138685.png" alt="friends">
            </div>
            
            <div class="nav-item" id="tab-3" onclick="move(3)">
                <div class="avatar" id="pfp"></div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const blob = document.getElementById('blob');
        const items = document.querySelectorAll('.nav-item');
        let currentIndex = 0;

        function move(index) {
            const targetItem = document.getElementById(`tab-${index}`);
            
            // Если нажали на ту же вкладку - СЛУЧАЙНАЯ деформация
            if (index === currentIndex) {
                const r = () => Math.floor(Math.random() * 70 + 20); // Случайные 20-90%
                blob.style.borderRadius = `${r()}% ${r()}% ${r()}% ${r()}% / ${r()}% ${r()}% ${r()}% ${r()}%`;
                blob.style.transform = `scale(${1 + Math.random() * 0.2}) rotate(${Math.random() * 10 - 5}deg)`;
                
                setTimeout(() => {
                    blob.style.borderRadius = '50%';
                    blob.style.transform = 'scale(1) rotate(0deg)';
                }, 300);
                
                tg.HapticFeedback.notificationOccurred('success');
                return;
            }

            // Обычное движение
            items.forEach(item => item.classList.remove('active'));
            blob.classList.remove('stretch-right', 'stretch-left');

            if (index > currentIndex) blob.classList.add('stretch-right');
            else blob.classList.add('stretch-left');

            const targetX = targetItem.offsetLeft + (targetItem.offsetWidth / 2) - (blob.offsetWidth / 2);
            blob.style.left = `${targetX}px`;
            
            targetItem.classList.add('active');
            currentIndex = index;

            setTimeout(() => {
                blob.classList.remove('stretch-right', 'stretch-left');
            }, 250);

            tg.HapticFeedback.impactOccurred('medium');
        }

        const lang = tg.initDataUnsafe.user?.language_code || 'en';
        const t = { ru: "ДЛЯ ТЕБЯ", zh: "为你推荐", en: "FOR YOU" };
        document.getElementById('title').innerText = t[lang] || t.en;

        if (tg.initDataUnsafe.user?.photo_url) {
            document.getElementById('pfp').style.backgroundImage = `url(${tg.initDataUnsafe.user.photo_url})`;
            document.getElementById('pfp').style.backgroundSize = 'cover';
        }

        window.onload = () => move(0);
    </script>
</body>
</html>
