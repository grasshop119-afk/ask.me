<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        :root {
            --tg-bg: #000000;
            --tg-accent: #248bf5;
            --tg-accent-gradient: linear-gradient(135deg, #248bf5 0%, #a336ff 100%);
            --card-bg: rgba(28, 28, 30, 0.6);
            --glass-border: 1px solid rgba(255, 255, 255, 0.12);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        body {
            margin: 0;
            background-color: var(--tg-bg);
            color: white;
            font-family: 'SF Pro Display', -apple-system, system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* --- HEADER & TOP NAVIGATION --- */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding-top: calc(var(--safe-top) + 60px); /* Место под кнопки TG */
            padding-left: 20px;
            padding-bottom: 20px;
            background: linear-gradient(to bottom, black 60%, transparent);
        }

        .app-title {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1px;
            background: var(--tg-accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- STORIES (CAPSULES) --- */
        .stories-container {
            padding: 0 20px 25px;
            display: flex;
            gap: 14px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .stories-container::-webkit-scrollbar { display: none; }

        .story-capsule {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-width: 72px;
        }

        .story-ring {
            width: 68px;
            height: 68px;
            border-radius: 26px;
            padding: 2px;
            background: var(--tg-accent-gradient);
            position: relative;
        }

        .story-ring.watched {
            background: rgba(255,255,255,0.1);
        }

        .story-ring img {
            width: 100%;
            height: 100%;
            border-radius: 24px;
            object-fit: cover;
            border: 3px solid black;
        }

        /* --- MAIN FEED (3D LAYERS) --- */
        .main-scroll {
            height: 100vh;
            overflow-y: scroll;
            padding-top: 240px; /* Отступ чтобы сторис не заезжали под шапку */
            padding-bottom: 150px;
            -webkit-overflow-scrolling: touch;
        }

        .post-card {
            margin: 0 16px 24px;
            position: relative;
            border-radius: 40px;
            background: var(--card-bg);
            border: var(--glass-border);
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .media-container {
            width: 100%;
            aspect-ratio: 1 / 1.2;
            position: relative;
        }

        .media-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay-glass {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        /* --- ACTION BUTTONS (CLEAN) --- */
        .side-actions {
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
        }

        .btn-glass {
            width: 44px;
            height: 44px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            border: var(--glass-border);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-glass:active { transform: scale(0.9); }

        .btn-glass img {
            width: 22px;
            height: 22px;
            filter: invert(1);
        }

        /* --- NAV ISLAND (RESTORED & IMPROVED) --- */
        .nav-wrapper {
            position: fixed;
            bottom: calc(35px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .nav-island {
            width: 260px;
            height: 70px;
            background: rgba(20, 20, 22, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 35px;
            border: var(--glass-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .blob {
            position: absolute;
            width: 54px;
            height: 54px;
            background: var(--tg-accent-gradient);
            border-radius: 22px;
            z-index: 0;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 0 15px rgba(36, 139, 245, 0.4);
        }

        .nav-item {
            position: relative;
            z-index: 1;
            width: 60px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-item img {
            width: 26px;
            height: 26px;
            filter: invert(1);
            opacity: 0.4;
            transition: 0.3s;
        }

        .nav-item.active img { opacity: 1; }

        .pfp-nav {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: #333;
            background-size: cover;
            border: 2px solid transparent;
        }
        .active .pfp-nav { border-color: white; }

    </style>
</head>
<body>

    <div class="app-header">
        <div class="app-title">ДЛЯ ТЕБЯ</div>
        <div class="stories-container" id="stories">
            </div>
    </div>

    <div class="main-scroll" id="mainScroll">
        </div>

    <div class="nav-wrapper">
        <div class="nav-island">
            <div class="blob" id="blob"></div>
            <div class="nav-item active" onclick="navTo(0, this)">
                <img src="https://cdn-icons-png.flaticon.com/512/6997/6997164.png">
            </div>
            <div class="nav-item" onclick="navTo(1, this)">
                <img src="https://cdn-icons-png.flaticon.com/512/8025/8025278.png">
            </div>
            <div class="nav-item" onclick="navTo(2, this)">
                <div class="pfp-nav" id="navPfp"></div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // 1. Настройка контента (Креативный подход)
        const mockStories = [
            { id: 1, img: 'https://i.pravatar.cc/150?u=1' },
            { id: 2, img: 'https://i.pravatar.cc/150?u=2' },
            { id: 3, img: 'https://i.pravatar.cc/150?u=3' },
            { id: 4, img: 'https://i.pravatar.cc/150?u=4' },
            { id: 5, img: 'https://i.pravatar.cc/150?u=5' }
        ];

        const mockPosts = [
            { user: 'Alex Red', likes: '12K', img: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800' },
            { user: 'Inspo Lab', likes: '8.4K', img: 'https://images.unsplash.com/photo-1633167606207-d840b5070fc2?w=800' }
        ];

        // Рендер сторис
        const storiesTitle = `<div class="story-capsule"><div class="story-ring"><img src="${tg.initDataUnsafe.user?.photo_url || 'https://i.pravatar.cc/100'}"></div><span style="font-size:10px; opacity:0.6">Вы</span></div>`;
        document.getElementById('stories').innerHTML = storiesTitle + mockStories.map(s => `
            <div class="story-capsule">
                <div class="story-ring ${s.id > 3 ? 'watched' : ''}">
                    <img src="${s.img}">
                </div>
                <span style="font-size:10px; opacity:0.6">User ${s.id}</span>
            </div>
        `).join('');

        // Рендер ленты
        document.getElementById('mainScroll').innerHTML = mockPosts.map(p => `
            <div class="post-card">
                <div class="media-container">
                    <img src="${p.img}" loading="lazy">
                    <div class="overlay-glass">
                        <div>
                            <div style="font-weight:700; font-size:18px; margin-bottom:4px;">${p.user}</div>
                            <div style="font-size:13px; opacity:0.7;">Digital Artifact #024</div>
                        </div>
                        <div class="side-actions">
                            <div class="btn-glass" onclick="haptic('heavy')">
                                <img src="https://cdn-icons-png.flaticon.com/512/7754/7754213.png">
                            </div>
                            <div class="btn-glass" onclick="haptic('medium')">
                                <img src="https://cdn-icons-png.flaticon.com/512/6997/6997415.png">
                            </div>
                            <div class="btn-glass" style="background:var(--tg-accent-gradient); border:none;" onclick="haptic('light')">
                                <img src="https://cdn-icons-png.flaticon.com/512/2550/2550240.png">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');

        // 2. Навигация (Blob logic)
        const blob = document.getElementById('blob');
        function navTo(index, el) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            
            const x = el.offsetLeft + (el.offsetWidth / 2) - (blob.offsetWidth / 2);
            blob.style.left = `${x}px`;
            
            tg.HapticFeedback.impactOccurred('medium');
        }

        function haptic(style) {
            tg.HapticFeedback.impactOccurred(style);
        }

        // Синхронизация аватара
        if (tg.initDataUnsafe.user?.photo_url) {
            document.getElementById('navPfp').style.backgroundImage = `url(${tg.initDataUnsafe.user.photo_url})`;
        }

        // Инициализация позиции блоба
        window.onload = () => navTo(0, document.querySelector('.nav-item'));

    </script>
</body>
</html>
